[pytest]
# Repo root on sys.path so `import aptbot` resolves when tests run from the repo root.
pythonpath = .
# Every `async def test_*` is auto-collected as an asyncio test (no per-test
# decorator needed).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    live: hits a real remote API (Yad2 gateway, Tel Aviv GIS); needs network. Excluded by default; run with `-m live`.
# Plain `pytest` / `pytest tests/unit` stays OFFLINE (live excluded). A
# command-line `-m live` appears after these addopts and wins, so `pytest -m live`
# runs the live smoke tests.
addopts = -ra -m "not live"
