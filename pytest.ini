[pytest]
# Repo root on sys.path so `import config`, `import engine`, ... resolve when
# tests run from the repo root.
pythonpath = .
# Every `async def test_*` is auto-collected as an asyncio test (no per-test
# decorator needed).
asyncio_mode = auto
testpaths = tests
markers =
    live: hits the real external APIs (Yad2 gateway, rentlyfly.ai); needs network. Excluded by default; run with `-m live`.
# Plain `pytest` / `pytest tests/unit` stays OFFLINE (live excluded). A
# command-line `-m live` appears after these addopts and wins, so `pytest -m live`
# runs the live smoke tests.
addopts = -ra -m "not live"
